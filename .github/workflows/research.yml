name: Open research adjudication
on:
  workflow_call:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      comment_id:
        description: Original PR-author signed comment ID to process or resume
        required: false
        type: string
  schedule:
    - cron: '3,18,33,48 * * * *'
permissions:
  contents: write
  pull-requests: write
  checks: write
jobs:
  process:
    outputs:
      comment_id: ${{ steps.claim.outputs.comment_id }}
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       github.event_name == 'workflow_run' || github.event_name == 'push' ||
      (github.event.action == 'created' && github.event.issue.pull_request && (startsWith(github.event.comment.body, 'Open-Mathematics-Claim: ') || startsWith(github.event.comment.body, 'Open-Mathematics-Process: ') || startsWith(github.event.comment.body, 'Open-Mathematics-Retry: '))))
    environment: protocol
    concurrency:
      group: research-executor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    defaults:
      run:
        working-directory: protocol
    env:
      OPEN_MATH_PROBLEM_DIR: ${{ github.workspace }}/problem
    steps:
      - name: Read this exact reviewed problem configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: problem
          persist-credentials: false
      - name: Read the pinned protocol implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MuncleUscles/pnp.fun
          ref: 93c7d3fce28163b281a33fcdfeab00aed06c46f4
          path: protocol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Read the reviewed Studio wallet and appeal worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MuncleUscles/pnp.fun
          ref: 25c877483987bb48ea4a88fb2e010be9181ec1d3
          path: review
          persist-credentials: false
      - name: Install the review worker’s pinned dependencies
        run: npm ci --ignore-scripts
        working-directory: review
      - name: Select a valid signed claim
        id: claim
        run: node ../review/github/open-select.mjs
        env:
          OPEN_MATH_VERIFIER_DIR: ${{ github.workspace }}/protocol
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build pinned isolated Lean
        if: steps.claim.outputs.comment_id != '' && steps.claim.outputs.needs_lean != 'false'
        run: bash github/build-full-lean.sh
      - name: Verify and implement GenLayer's final decision
        if: steps.claim.outputs.comment_id != ''
        run: node ../review/github/open-worker.mjs
        env:
          OPEN_MATH_VERIFIER_DIR: ${{ github.workspace }}/protocol
          REVIEW_RETRY_HASH: ${{ steps.claim.outputs.retry_hash }}
          CLAIM_COMMENT_ID: ${{ steps.claim.outputs.comment_id }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFIER_SIGNING_KEY: ${{ secrets.VERIFIER_SIGNING_KEY }}
          EXECUTOR_SIGNING_KEY: ${{ secrets.EXECUTOR_SIGNING_KEY }}
  accounts:
    needs: process
    if: >-
      always() && !cancelled() && needs.process.result != 'skipped' &&
      ((github.event_name != 'workflow_run' && github.event_name != 'push') || needs.process.outputs.comment_id != '') &&
      github.ref == 'refs/heads/main'
    environment: protocol
    concurrency:
      group: research-executor
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: protocol
    env:
      OPEN_MATH_PROBLEM_DIR: ${{ github.workspace }}/problem
    steps:
      - name: Read this exact reviewed problem configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: problem
          persist-credentials: false
      - name: Read the pinned protocol implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MuncleUscles/pnp.fun
          ref: 93c7d3fce28163b281a33fcdfeab00aed06c46f4
          path: protocol
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: protocol/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Reconcile native GitHub identity and points
        run: node github/sync-accounts.mjs ../problem
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXECUTOR_SIGNING_KEY: ${{ secrets.EXECUTOR_SIGNING_KEY }}
