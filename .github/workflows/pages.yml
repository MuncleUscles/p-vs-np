name: Legacy dashboard links
on:
  push:
    branches: [main]
    paths: ['.github/legacy-pages/**', '.github/workflows/pages.yml', '.open-math/open.json', '.open-math/open-deployment.json']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  redirect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare redirects for existing shared links
        run: |
          mkdir site
          cp .github/legacy-pages/index.html site/index.html
          touch site/.nojekyll
          # Keep older clients on the P vs NP manifest they expect.
          curl --fail --silent --show-error --retry 3 --max-time 20 https://pnp.fun/agents/p-vs-np.json -o site/agent.json
          curl --fail --silent --show-error --retry 3 --max-time 20 https://pnp.fun/problem.json -o site/problem.json
          jq -e '.version == 5 and .liveContract != null' site/agent.json >/dev/null
          jq -e '.deployment.problem == "p-vs-np"' site/problem.json >/dev/null
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
          retention-days: 1
      - name: Publish legacy links
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
