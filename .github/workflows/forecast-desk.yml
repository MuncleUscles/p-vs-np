name: Forecast desk checkpoint
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forecast-desk-checkpoint
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: problem
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MuncleUscles/open-mathematics
          ref: ef177357def62ec65daf47dbc2870ccb068202f7
          persist-credentials: false
          path: renderer
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Capture the published rules, signed records and native outcome
        run: node renderer/scripts/archive-forecasts.mjs problem/.open-math/forecasts.json audit
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forecast-audit-${{ github.run_id }}
          path: audit/forecast-audit.json
          retention-days: 90
          if-no-files-found: error
