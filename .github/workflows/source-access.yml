name: Public source access check
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Public upstream owner/repository to diagnose
        required: true
        type: string
      pr_number:
        description: Optional exact upstream PR number to diagnose
        required: false
        type: string
      source_case:
        description: Optional checked-in source for complete provenance collection
        required: false
        type: choice
        default: none
        options: [none, A, B, C, D-anthropic]
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public API access without exposing response content or credentials
        env:
          SOURCE_REPOSITORY: ${{ inputs.repository }}
          SOURCE_PR_NUMBER: ${{ inputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const repository=process.env.SOURCE_REPOSITORY;
          if(!/^[A-Za-z0-9][A-Za-z0-9-]{0,38}\/[A-Za-z0-9_.-]{1,100}$/.test(repository)||repository!==repository.trim()||['.','..'].includes(repository.split('/')[1]))throw Error('Invalid repository');
          const pr=process.env.SOURCE_PR_NUMBER||'';
          if(pr!==''&&(!/^[1-9][0-9]{0,15}$/.test(pr)||!Number.isSafeInteger(Number(pr))||String(Number(pr))!==pr))throw Error('Invalid PR number');
          const paths=['/repos/'+repository];
          if(pr!=='')paths.push(paths[0]+'/pulls/'+pr);
          for(const path of paths)for(const authenticated of [false,true]){
            const url='https://api.github.com'+path;
            let failureClass='transport-or-deadline';
            try{
            const headers={Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'open-mathematics-source-diagnostic','Accept-Encoding':'identity'};
            if(authenticated)headers.Authorization='Bearer '+process.env.GITHUB_TOKEN;
            const response=await fetch(url,{headers,redirect:'error',signal:AbortSignal.timeout(10000)});
            const numeric=name=>{const s=response.headers.get(name);return s!==null&&/^\d{1,12}$/.test(s)?Number(s):null;};
            const result={path,authenticated,status:response.status,limit:numeric('x-ratelimit-limit'),remaining:numeric('x-ratelimit-remaining'),reset:numeric('x-ratelimit-reset'),retry_after:numeric('retry-after'),classification:null};
            failureClass='body-read-failure';
            const reader=response.body.getReader();let total=0;const chunks=[];
            try{while(true){const {done,value}=await reader.read();if(done)break;total+=value.byteLength;if(total>32768){result.classification='body-too-large';await reader.cancel();break;}chunks.push(value);}}
            finally{reader.releaseLock();}
            if(result.classification===null){
              let message;try{message=JSON.parse(Buffer.concat(chunks).toString('utf8')).message;}catch{}
              if(typeof message==='string'){
                if(message.startsWith('API rate limit exceeded for '))result.classification='primary-rate-limit';
                else if(message.includes('secondary rate limit'))result.classification='secondary-rate-limit';
                else if(message==='Resource not accessible by integration')result.classification='integration-access';
                else if(message==='Bad credentials')result.classification='bad-credentials';
                else if(message==='Not Found')result.classification='not-found';
              }
            }
            if([403,429].includes(result.status)&&result.remaining===0)result.classification='primary-rate-limit';
            console.log(JSON.stringify(result));
            }catch{console.log(JSON.stringify({path,authenticated,classification:failureClass}));}
          }
          JS
      - name: Read this exact reviewed diagnostic and source requests
        if: inputs.source_case != '' && inputs.source_case != 'none'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: problem
          persist-credentials: false
      - name: Read the exact provenance collector under diagnosis
        if: inputs.source_case != '' && inputs.source_case != 'none'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: MuncleUscles/pnp.fun
          ref: 7669a2cdd54dee1f828f02f86723b4d5ff526075
          path: protocol
          persist-credentials: false
      - name: Use the reviewed collector runtime
        if: inputs.source_case != '' && inputs.source_case != 'none'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.0
      - name: Compare complete authenticated and anonymous source collection
        if: inputs.source_case != '' && inputs.source_case != 'none'
        run: node problem/.github/scripts/source-collector-access.mjs
        env:
          SOURCE_CASE: ${{ inputs.source_case }}
          GITHUB_TOKEN: ${{ github.token }}
